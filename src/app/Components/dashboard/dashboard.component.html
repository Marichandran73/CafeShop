<app-navbar></app-navbar>

<div class="container h-100vh px-40">
  <h2>Chocolate Cakes</h2>

  <div class="container grid grid-cols-3 gap-6">

    @for (cake of chocolateList; track cake.id) {
      <div class="shadow-lg p-4 rounded-lg bg-white">
        <img class="w-full h-48 object-cover rounded-lg" 
             [src]="cake.image" 
             [alt]="cake.name">

        <!-- ⭐ Star Rating -->
        <span *ngFor="let star of [1,2,3,4,5]">
          <span [style.color]="star <= cake.starRate ? 'gold' : 'lightgray'">
            ★
          </span>
        </span>

        <p class="font-bold mt-2">{{ cake.name }}</p>
        <p class="text-green-600">{{ cake.price | currency:'INR' }}</p>
        <p class="text-sm text-gray-600">{{ cake.description }}</p>
        <button class="bg-blue-700 hover:bg-blue-900 text-white font-bold py-2 px-4 rounded"
                (click)="addToCart()">Add to Cart</button>
      </div>
    }

  </div>
</div>

<app-footer></app-footer>
